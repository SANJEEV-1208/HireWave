spring.application.name=hirewave

# PostgreSQL — override with DB_URL / DB_USERNAME / DB_PASSWORD env vars in production
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobportal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server port — Railway sets PORT automatically
server.port=${PORT:8081}

# JWT — replace the default with a strong random key in production via JWT_SECRET env var
jwt.secret=${JWT_SECRET:LocalDevOnlySecretKeyChangeInProduction256BitsMinimumRequired!!}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# File uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=${UPLOAD_DIR:uploads/resumes}

# Gmail SMTP — set MAIL_USERNAME and MAIL_PASSWORD env vars (use a Gmail App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-gmail-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth 2.0
google.client-id=${GOOGLE_CLIENT_ID:your-google-oauth-client-id}

# Groq AI API (named gemini.api-key for historical reasons)
gemini.api-key=${GROQ_API_KEY:your-groq-api-key}

# CORS — comma-separated list of allowed frontend origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
